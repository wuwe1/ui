# Every push and PR: tokens.css is current, types check, tests pass, the showcase builds
name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tokens.css is current (pnpm gen after a theme change)
        run: pnpm gen && git diff --exit-code src/theme/tokens.css
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
