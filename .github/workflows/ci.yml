# 每次推送、PR：生成的 tokens.css 是最新的、类型检查、测试、展示页打得出来
name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tokens.css 是最新的（改了主题要 pnpm gen）
        run: pnpm gen && git diff --exit-code src/theme/tokens.css
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
